plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coursevault.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.coursevault.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // >>> EDIT THIS: your hosted site (no trailing slash) <<<
        manifestPlaceholders = [
            twaUrl : "https://fb17-84855.web.app/",
            twaHost: "fb17-84855.web.app"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
