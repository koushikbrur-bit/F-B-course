plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coursevault.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.coursevault.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // URL is passed in by the GitHub workflow (-PtwaUrl / -PtwaHost).
        manifestPlaceholders = [
            twaUrl : (project.findProperty('twaUrl')  ?: "https://example.github.io/course-vault/"),
            twaHost: (project.findProperty('twaHost') ?: "example.github.io")
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
